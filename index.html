<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NikWeb 🍄</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(#62c8ff 0 62%,#69bf4a 62%);min-height:100vh;color:#222}
header{background:#e52521;color:#fff;text-align:center;padding:24px;border-bottom:7px solid #ffd21c}
h1{font-size:48px;margin:0;text-shadow:4px 4px #111} header p{font-size:19px}
main{max-width:900px;margin:auto;padding:35px 16px}.card{background:#fff;border:5px solid #222;border-radius:18px;padding:24px;margin-bottom:24px;box-shadow:0 8px 0 #222}
h2{margin-top:0}.buttons{display:flex;flex-wrap:wrap;gap:12px}.btn{display:inline-block;text-decoration:none;color:#111;background:#ffd21c;border:4px solid #222;border-radius:12px;padding:12px 18px;font-weight:700}
.item{padding:14px;margin:10px 0;background:#f4f4f4;border:3px solid #222;border-radius:12px}.empty{opacity:.7}
footer{text-align:center;background:#8b572a;color:#fff;padding:22px;border-top:8px solid #48a63c}
</style>
</head>
<body>
<header><h1>🍄 NikWeb</h1><p>Your fun corner of the internet!</p></header>
<main>
<section class="card">
<h2>🔗 Links</h2><div id="links"></div>
</section>
<section class="card">
<h2>📁 Files</h2><div id="files"></div>
</section>
<section class="card">
<h2>⭐ Welcome!</h2><p>Come back soon for new games, links and files.</p></section>
</main>
<footer>🍄 NikWeb • Made for fun 🎮</footer>
<script>
const links=JSON.parse(localStorage.getItem("nikweb_links")||"[]");
const files=JSON.parse(localStorage.getItem("nikweb_files")||"[]");
document.getElementById("links").innerHTML=links.length?links.map(x=>`<div class="item"><a class="btn" href="${escapeAttr(x.url)}" target="_blank" rel="noopener">${escapeHtml(x.name)}</a></div>`).join(""):'<p class="empty">No links yet.</p>';
document.getElementById("files").innerHTML=files.length?files.map(x=>`<div class="item">📄 <a href="${escapeAttr(x.url)}" target="_blank" rel="noopener">${escapeHtml(x.name)}</a></div>`).join(""):'<p class="empty">No files yet.</p>';
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function escapeAttr(s){return escapeHtml(s)}
</script>
</body>
</html>
